---
name: Secret scan

# Defence in depth for a PUBLIC repository. Local pre-commit runs
# detect-secrets + gitleaks on staged changes; GitHub secret scanning and
# push protection run on the server. This workflow re-scans the FULL git
# history on every push and pull request, and weekly, so a leak that slipped
# past a hook (or a rule added after the fact) is still caught.
#
# Pinned to the same gitleaks version used locally. No license is required
# for a personal account; the container form avoids the marketplace action's
# organisation licensing.

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/gitleaks/gitleaks:v8.30.1
      options: --entrypoint ""
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan full history
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gitleaks git --no-banner --redact --config .gitleaks.toml --exit-code 1 .
      - name: Scan working tree
        run: gitleaks dir --no-banner --redact --config .gitleaks.toml --exit-code 1 .
