[project]
name = "istari"
version = "0.1.0"
description = "Istari — personal learning and certification-training platform. Knowledge, earned."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.142.2",
    "fsrs>=6.3.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.3",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

# ─── ruff ───────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF", "SIM", "T20"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "T20"]
"app/cli/**" = ["T20"]
"scripts/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ─── mypy ───────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "fsrs.*", "factory.*"]
ignore_missing_imports = true

# Tests poke at JSON responses; `Any` there is pragmatic, not a hole in app code.
[[tool.mypy.overrides]]
module = "tests.*"
warn_return_any = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ─── pytest ─────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run: the async engine is session-scoped and
# asyncpg connections are bound to the loop that created them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = ["error::RuntimeWarning"]

# ─── import-linter (layer contracts) ────────────────────────────────
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "domain is pure: no adapters, services, routes, app wiring"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.adapters", "app.services", "app.routes", "app.main", "app.deps", "app.cli"]

[[tool.importlinter.contracts]]
name = "adapters never import services, routes, or app wiring"
type = "forbidden"
source_modules = ["app.adapters"]
forbidden_modules = ["app.services", "app.routes", "app.main", "app.deps", "app.cli"]

[[tool.importlinter.contracts]]
name = "services never import routes or app wiring"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["app.routes", "app.main", "app.cli"]
